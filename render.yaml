services:
  - type: web
    name: certchain-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CONTRACT_ADDRESS
        value: 0xCa70e753D2DFcd32532Fb3f236B66c9494F01330
      - key: CHAIN_ID
        value: 11155111
      - key: FRONTEND_URL
        value: https://certchain-2-0.vercel.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RPC_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: IPFS_ENABLED
        value: "true"
      - key: IPFS_PROVIDER
        value: "pinata"
      - key: IPFS_API_TOKEN
        sync: false
      - key: IPFS_GATEWAY_URL
        value: "https://gateway.pinata.cloud/ipfs"
      - key: IPFS_ENCRYPTION_KEY
        sync: false
